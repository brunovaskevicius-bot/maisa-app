<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>maisa — painel</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{height:100%}body{margin:0;background:var(--surface-page);overflow:hidden}#root{height:100vh}.ms-toast-slot{position:fixed;right:24px;bottom:24px;z-index:200}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Inicio.jsx"></script>
<script type="text/babel" src="Conversas.jsx"></script>
<script type="text/babel" src="Agenda.jsx"></script>
<script type="text/babel" src="Clientes.jsx"></script>
<script type="text/babel" src="Notas.jsx"></script>
<script type="text/babel" src="Ajustes.jsx"></script>
<script type="text/babel">
const { Button, Icon, Dialog, Toast, Input, Select, EmptyState } = window.MaisaDesignSystem_00adcb;

const CABECALHO = {
  inicio: ['Boa tarde, Renata', 'Quinta, 27 de julho'],
  conversas: ['Conversas', '2 esperando você · 31 respondidas pela maisa hoje'],
  agenda: ['Agenda', 'Studio Lasca · fuso de Brasília'],
  clientes: ['Clientes', '218 pessoas já falaram com a maisa'],
  notas: ['Notas fiscais', 'Prefeitura de São Paulo · certificado ativo'],
  ajustes: ['Ajustes', 'Como a maisa trabalha por você'],
};

function App() {
  const [view, setView] = React.useState('inicio');
  const [modal, setModal] = React.useState(false);
  const [toast, setToast] = React.useState(false);
  const [titulo, sub] = CABECALHO[view];

  const emitir = () => { setModal(false); setToast(true); setTimeout(() => setToast(false), 4200); };
  const cheio = view === 'conversas' || view === 'agenda';

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      <Sidebar view={view} setView={setView} />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
        <Topbar title={titulo} sub={sub} action={view === 'conversas'
          ? <Button variant="primary" size="sm" iconLeft={<Icon name="plus" size={17} />}>Nova conversa</Button>
          : <Button variant="primary" size="sm" iconLeft={<Icon name="document-text" size={17} />} onClick={() => setModal(true)}>Emitir nota</Button>} />
        <main style={{ flex: 1, minHeight: 0, overflow: cheio ? 'hidden' : 'auto', padding: 24 }}>
          {view === 'inicio' && <Inicio go={setView} />}
          {view === 'conversas' && <Conversas onEmitir={() => setModal(true)} />}
          {view === 'agenda' && <Agenda />}
          {view === 'clientes' && <Clientes />}
          {view === 'notas' && <Notas onEmitir={() => setModal(true)} />}
          {view === 'ajustes' && <Ajustes />}
        </main>
      </div>

      <Dialog open={modal} onClose={() => setModal(false)} title="Emitir nota fiscal"
        description="A maisa manda o link pro WhatsApp do cliente assim que sair."
        footer={<><Button variant="secondary" onClick={() => setModal(false)}>Cancelar</Button><Button variant="primary" onClick={emitir}>Emitir</Button></>}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <Select label="Cliente" options={['Juliana Prado', 'Marcos Aurélio', 'Beatriz Nunes']} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <Select label="Serviço" options={['Corte + escova', 'Barba', 'Coloração']} />
            <Input label="Valor" defaultValue="R$ 180,00" />
          </div>
          <Input label="CPF" defaultValue="312.887.440-11" hint="A maisa já preencheu com o que tinha no cadastro." />
        </div>
      </Dialog>

      {toast && <div className="ms-toast-slot"><Toast tone="success" title="NF-e 1.285 emitida" description="Link enviado no WhatsApp da Juliana." onClose={() => setToast(false)} /></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
