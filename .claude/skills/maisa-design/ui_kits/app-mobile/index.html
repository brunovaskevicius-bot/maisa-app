<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>maisa — app</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--cream-200);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../painel/data.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Moldura.jsx"></script>
<script type="text/babel" src="Telas.jsx"></script>
<script type="text/babel">
function AppMobile() {
  const [tab, setTab] = React.useState('hoje');
  const [conversa, setConversa] = React.useState(null);
  const conteudo = conversa
    ? <Conversa id={conversa} voltar={() => setConversa(null)} />
    : tab === 'hoje' ? <Hoje setTab={setTab} />
    : tab === 'conversas' ? <ListaConversas abrir={setConversa} />
    : tab === 'agenda' ? <AgendaMob />
    : <NotasMob />;
  return (
    <div style={{ display: 'flex', gap: 44, alignItems: 'center' }}>
      <Moldura tab={tab} setTab={(t) => { setConversa(null); setTab(t); }}>{conteudo}</Moldura>
      <div style={{ maxWidth: 300 }}>
        <span className="ms-logo" style={{ fontSize: 30 }}>maisa<span className="ms-logo__dot">.</span></span>
        <p style={{ font: 'var(--type-body)', color: 'var(--text-muted)', marginTop: 14 }}>
          Toque nas abas de baixo para navegar. Em <strong style={{ color: 'var(--text-strong)' }}>Conversas</strong>, abra qualquer contato para ver a thread do WhatsApp e o controle de quem responde.
        </p>
        <p style={{ font: 'var(--type-body-sm)', color: 'var(--text-subtle)', marginTop: 14 }}>390 × 844 · alvo de toque mínimo 44px · mesma escala tipográfica do painel, um passo menor.</p>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<AppMobile />);
</script></body></html>
