<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--surface-page);padding:20px;margin:0}.grp{margin-bottom:18px}.grp:last-child{margin-bottom:0}.lbl{font-family:var(--font-sans);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-subtle);margin-bottom:9px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Badge, Tag, Card, Avatar, Logo, Icon, Input, Textarea, Select, Checkbox, Radio, Switch, Dialog, Toast, Tooltip, EmptyState, Tabs, ChatBubble, StatCard } = window.MaisaDesignSystem_00adcb;
function Demo(){
const [c1,setC1]=React.useState(true),[c2,setC2]=React.useState(false),[plano,setPlano]=React.useState('pro'),[sw,setSw]=React.useState(true);
return(<>
<div className="grp"><div className="row" style={{alignItems:'flex-start',gap:16}}>
<div style={{flex:'1 1 230px'}}><Input label="Nome do cliente" defaultValue="Juliana Prado" /></div>
<div style={{flex:'1 1 230px'}}><Input label="WhatsApp" placeholder="(11) 90000-0000" prefix={<Icon name="phone" size={18} />} hint="É por aqui que a maisa fala com ele." /></div>
<div style={{flex:'1 1 180px'}}><Input label="CNPJ" defaultValue="12.345.678/0001-9" error="Falta um dígito." /></div>
</div></div>
<div className="grp"><div className="row" style={{alignItems:'flex-start',gap:16}}>
<div style={{flex:'1 1 220px'}}><Select label="Serviço" options={[{value:'corte',label:'Corte + escova'},{value:'barba',label:'Barba'}]} /></div>
<div style={{flex:'1 1 220px'}}><Input label="Observação" optional placeholder="Alguma preferência?" /></div>
<div style={{flex:'1 1 160px'}}><Input label="Bloqueado" disabled defaultValue="Não editável" /></div>
</div></div>
<div className="grp"><Textarea label="Como a maisa deve responder" rows={2} defaultValue="Sempre oferecer horário de manhã primeiro." /></div>
<div className="grp"><div className="lbl">Seleção</div><div className="row" style={{gap:24,alignItems:'flex-start'}}>
<div style={{display:'flex',flexDirection:'column',gap:10}}>
<Checkbox checked={c1} onChange={e=>setC1(e.target.checked)} label="Emitir NF automaticamente" description="Assim que o cliente confirmar." />
<Checkbox checked={c2} onChange={e=>setC2(e.target.checked)} label="Lembrar 24h antes" />
</div>
<div style={{display:'flex',flexDirection:'column',gap:10}}>
<Radio name="p" checked={plano==='pro'} onChange={()=>setPlano('pro')} label="Plano Pro" description="R$ 149/mês" />
<Radio name="p" checked={plano==='basico'} onChange={()=>setPlano('basico')} label="Plano Básico" description="R$ 79/mês" />
</div>
<div style={{display:'flex',flexDirection:'column',gap:12}}>
<Switch checked={sw} onChange={e=>setSw(e.target.checked)} label="maisa respondendo sozinha" />
<Switch checked={false} onChange={()=>{}} label="Modo férias" />
</div>
</div></div>
</>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
