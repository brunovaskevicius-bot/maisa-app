<!-- @dsCard group="Spacing" viewport="700x180" name="Movimento" subtitle="Rápido e discreto. Bounce só no knob do switch" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-page);padding:20px;font:var(--type-body-sm);color:var(--text-body)}.demo{width:110px;height:52px;border-radius:var(--radius-card);background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--brand-text);animation:slide 2.4s infinite}@keyframes slide{0%,55%,100%{transform:none}30%{transform:translateY(-8px)}}</style></head><body>
<div style="display:flex;gap:14px;flex-wrap:wrap">
<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:10px 14px"><div style="font-family:var(--font-mono);font-size:12px;color:var(--text-strong)">--dur-fast</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--brand-text)">120ms</div><div style="font-size:11px;color:var(--text-muted)">hover, cor</div></div><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:10px 14px"><div style="font-family:var(--font-mono);font-size:12px;color:var(--text-strong)">--dur-base</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--brand-text)">180ms</div><div style="font-size:11px;color:var(--text-muted)">abrir menu, switch</div></div><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:10px 14px"><div style="font-family:var(--font-mono);font-size:12px;color:var(--text-strong)">--dur-slow</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--brand-text)">280ms</div><div style="font-size:11px;color:var(--text-muted)">modal, toast</div></div><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:10px 14px"><div style="font-family:var(--font-mono);font-size:12px;color:var(--text-strong)">--dur-slower</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--brand-text)">420ms</div><div style="font-size:11px;color:var(--text-muted)">entrada de página</div></div>
</div>
<div style="display:flex;gap:14px;margin-top:14px;align-items:center"><div class="demo">--ease-out</div><p style="font-size:12px;color:var(--text-muted);max-width:44ch">Padrão: <code style="font-family:var(--font-mono)">--ease-out</code> para tudo que entra e sai. <code style="font-family:var(--font-mono)">--ease-spring</code> só no knob do switch. Nada de bounce em modal, card ou lista.</p></div></body></html>
