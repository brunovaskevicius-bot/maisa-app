<!-- @dsCard group="Colors" viewport="700x180" name="Semânticas" subtitle="Sucesso, atenção, erro e informação — sempre com o par de fundo claro" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-page);padding:20px;font:var(--type-body-sm);color:var(--text-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div><div style="height:34px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--success)"></div><div style="background:var(--success-soft);border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:10px"><div style="font-weight:600;font-size:13px;color:var(--success-text)">Sucesso</div><span class="ms-badge ms-badge--subtle ms-badge--success ms-badge--sm" style="margin-top:6px">Confirmado</span></div></div><div><div style="height:34px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--warning)"></div><div style="background:var(--warning-soft);border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:10px"><div style="font-weight:600;font-size:13px;color:var(--warning-text)">Atenção</div><span class="ms-badge ms-badge--subtle ms-badge--warning ms-badge--sm" style="margin-top:6px">Aguardando</span></div></div><div><div style="height:34px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--danger)"></div><div style="background:var(--danger-soft);border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:10px"><div style="font-weight:600;font-size:13px;color:var(--danger-text)">Erro</div><span class="ms-badge ms-badge--subtle ms-badge--danger ms-badge--sm" style="margin-top:6px">Cancelado</span></div></div><div><div style="height:34px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--info)"></div><div style="background:var(--info-soft);border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:10px"><div style="font-weight:600;font-size:13px;color:var(--info-text)">Info</div><span class="ms-badge ms-badge--subtle ms-badge--info ms-badge--sm" style="margin-top:6px">Em análise</span></div></div>
</div><p style="margin-top:12px;font-size:12px;color:var(--text-muted)">Sucesso reaproveita o verde da marca — no maisa, "deu certo" e "é da marca" são a mesma cor.</p></body></html>
