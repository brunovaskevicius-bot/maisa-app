<!-- @dsCard group="Colors" viewport="700x190" name="Superfícies" subtitle="Página creme, card branco — o contraste que dá a cara quente da marca" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-page);padding:20px;font:var(--type-body-sm);color:var(--text-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="height:88px;border-radius:var(--radius-card);background:var(--surface-page);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:10px"><span style="font:var(--type-mono);font-size:11px">--surface-page</span></div>
<div style="height:88px;border-radius:var(--radius-card);background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-sm);display:flex;align-items:flex-end;padding:10px"><span style="font:var(--type-mono);font-size:11px">--surface-card</span></div>
<div style="height:88px;border-radius:var(--radius-card);background:var(--surface-sunken);display:flex;align-items:flex-end;padding:10px"><span style="font:var(--type-mono);font-size:11px">--surface-sunken</span></div>
<div style="height:88px;border-radius:var(--radius-card);background:var(--surface-inverse);display:flex;align-items:flex-end;padding:10px"><span style="font:var(--type-mono);font-size:11px;color:var(--cream-50)">--surface-inverse</span></div>
</div><p style="margin-top:12px;font-size:12px;color:var(--text-muted)">Card branco sempre sobre página creme. Duas cores de fundo por tela, no máximo.</p></body></html>
