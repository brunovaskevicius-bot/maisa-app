# ─────────────────────────────────────────────────────────────────────────────
# O QUE RODA SOZINHO.
#
# Até 14/08/2026 este repositório tinha 142 testes que ninguém executava. Passavam
# na máquina de quem acabou de escrevê-los e mais em lugar nenhum — inclusive um
# (`src/arquitetura.test.ts`) cujo trabalho é justamente impedir que a arquitetura
# apodreça sem ninguém ver. Suíte que não roda sozinha não protege nada: ela vira
# documentação que envelhece, e o primeiro teste que quebrar vai ser apagado por
# quem achar que ele é que está errado.
#
# ── POR QUE ESTES TRÊS PASSOS, NESTA ORDEM.
# Não é uma lista de boas práticas. Cada um destes já deixou passar um defeito real,
# e estão ordenados do mais rápido para o mais lento — assim o erro mais bobo custa
# 20 segundos e não 2 minutos.
#
#   1. typecheck  Um `TS2802` (spread de Set sem `downlevelIteration`) quebrou um
#                 deploy da Vercel em 13/08. O erro não aparecia em nada local, só
#                 no build de produção, e `tsc --noEmit` o pega em segundos.
#   2. testes     As 142 asserções — incluindo as regras executáveis do
#                 `ARQUITETURA.md` e a lista de rotas públicas, que é o que faz a
#                 LP que cobra continuar aberta ao visitante.
#   3. build      Pega o que o `tsc` não pega: metadata inválida, rota que não
#                 exporta o que o Next espera, módulo que estoura na geração
#                 estática. É o que a Vercel faz, feito antes dela.
#
# ── POR QUE NÃO HÁ NENHUM SEGREDO AQUI.
# Verificado em 14/08/2026: `npm run build` completa com o ambiente VAZIO, e gera as
# três LPs. O código foi escrito para degradar sem chave (`isSupabaseConfigured`,
# `NaoConfigurado`) em vez de estourar na importação, e isso é o que permite esta CI
# não ter acesso a nada. Se um dia o build passar a exigir uma variável, o certo é
# consertar o módulo que quebrou o degradê — não adicionar um `secret` aqui.
#
# ⚠️ Corolário: um `secrets.` neste arquivo é sinal de que alguém tomou o caminho
# errado. A CI roda em fork, em PR de estranho, em log público. O que ela não tem,
# ela não vaza.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
  pull_request:

# Push seguido de push na mesma branch cancela o anterior: o resultado do commit
# do meio não interessa a ninguém, e a fila livre faz o do topo responder antes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck · testes · build
    runs-on: ubuntu-latest
    # Um build travado não pode consumir a cota do mês inteiro. O normal é ~2 min.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # 24 porque é o que a Vercel usa neste projeto (confirmado por
      # `vercel project inspect`). CI numa versão diferente da de produção testa um
      # programa que não é o que vai para o ar.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `ci` e não `install`: instala exatamente o que está no lockfile e falha se
      # ele divergir do package.json, em vez de resolver a diferença em silêncio.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      # `prebuild` dispara o `espelha-lp`, então este passo também prova que o
      # espelhamento `lp/` → `public/lp/` funciona — e é dele que sai a única LP do
      # produto com link de pagamento.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
